capacity:
  max_active_contracts: 3
  max_total_hours_week: 40
  warn_at_utilization: 0.8
followups:
  max_followups: 2
  schedule_business_days:
  - 5
  - 10
fx:
  fx_as_of: '2026-10-01'
  rates:
    EUR: 1.08
    GBP: 1.27
    RUB: 0.011
    UAH: 0.025
    USD: 1.0
llm:
  daily_token_budget: 2000000
  max_retries: 3
  models:
    classify: <model-id-small>
    compose: <model-id-strong>
    judge: <model-id-strong-different-prompt-role>
    parse: <model-id-small>
  provider: anthropic
  redact_pii_in_logs: true
  temperature:
    classify: 0.0
    compose: 0.4
    judge: 0.0
    parse: 0.0
paths:
  data_dir: ../data
  output_dir: ../data/out
principal:
  min_overlap_hours: 3
  target_overlap_hours: 4
  timezone: Europe/Kiev
  work_window_local:
    end: '18:00'
    start: 09:00
router:
  allow_below_floor_if_hours_leq: 10
  countries_allow: []
  countries_deny:
  - SG
  - RU
  engagement_types_allow:
  - contractor
  - b2b
  - freelance
  - project
  min_score_to_apply: 65
  rate_ceiling_usd_month: 4000
  rate_floor_usd_month: 2000
send:
  autosend:
    allowed_channels: []
    enabled: false
  max_per_day: 20
  min_gap_seconds: 90
  quiet_hours_local:
    end: 07:00
    start: '21:00'
