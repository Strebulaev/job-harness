id: e_technical_advisor
name: "Technical Advisor / Fractional CTO"
headline_templates:
  - "Fractional Technical Advisor — architecture, AI strategy, hiring"
must_have_keywords: [architecture, strategy, "technical", advisory]
nice_to_have_keywords: [roadmap, "hiring", "fractional", "cto", governance]
jd_match_signals: [advisor, advisory, "fractional", "cto", "technical leadership", strategy, "roadmap"]
fact_selection:
  prefer_tags: [strategy, architecture, leadership]
  suppress_kinds: []
  max_bullets_per_role:
    recent: 4
    older: 3
cover_letter:
  proof_points_tags: [strategy, architecture, leadership]
  avoid_phrases: ["passionate", "rockstar", "ninja", "disrupt"]
rate_guidance_usd_month:
  min: 2500
  max: 4000
typical_hours_week: [10, 20]
