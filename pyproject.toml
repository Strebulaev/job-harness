[project]
name = "jobharness"
version = "0.1.0"
description = "Local-first contractor job-search agent harness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Principal" }]

dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "tenacity>=8.5",
    "aiolimiter>=1.1",
    "jinja2>=3.1",
    "rank-bm25>=0.2.2",
    "apscheduler>=3.10",
    "pypdf>=4.2",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
jh = "jobharness.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["jobharness"]
warn_unreachable = true



[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplicity
]
