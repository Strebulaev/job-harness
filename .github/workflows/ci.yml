name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12
        shell: bash

      - name: Sync dependencies
        run: uv sync
        shell: bash

      - name: Ruff
        run: uv run ruff check src/ tests/
        shell: bash

      - name: Mypy (strict)
        run: uv run mypy
        shell: bash

      - name: Install Typst
        run: |
          TYPST_VERSION=0.13.1
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin --wildcards '*/typst'
          typst --version
        shell: bash

      - name: Pytest (unit + integration + e2e)
        run: uv run pytest tests/unit tests/integration tests/e2e -q
        shell: bash

      - name: jh init + profile validate
        run: |
          uv run jh init
          uv run jh profile validate --path config/profile.example.yaml
        shell: bash

      - name: Router golden baseline check
        run: |
          uv run jh eval run --suite all --json
        shell: bash

      - name: Docker build
        run: docker build -t jobharness .
        shell: bash
